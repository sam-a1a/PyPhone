[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers

# pygame is imported transitively and wants a display. tests/conftest.py sets
# SDL_VIDEODRIVER=dummy before the first import so the suite runs the same on
# a laptop and on a headless CI runner.
filterwarnings =
    ignore::DeprecationWarning:pygame.pkgdata
    ignore:.*NumPy module was reloaded.*:UserWarning
